<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
    --bg: #07070a;
    --bg2: #0d0d13;
    --card: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.09);
    --text: #f5f5f7;
    --muted: #9a9aa7;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --cyan: #22d3ee;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at 15% 10%, rgba(139,92,246,.16), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(59,130,246,.12), transparent 28%),
        linear-gradient(180deg, #07070a 0%, #0a0a10 50%, #07070a 100%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* subtle grid */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: -1;
}

/* glowing blobs */
body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(139,92,246,.08);
    filter: blur(100px);
    top: 35%;
    right: -200px;
    pointer-events: none;
    z-index: -1;
}

/* ================= NAVBAR ================= */

nav {
    position: sticky;
    top: 16px;
    z-index: 100;
    width: min(1100px, calc(100% - 32px));
    margin: 16px auto 0;
    padding: 14px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(12,12,18,.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid var(--border);
    border-radius: 18px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.04);
}

nav a {
    color: #aaaab5;
    text-decoration: none;
    margin-left: 24px;
    font-size: 14px;
    font-weight: 500;
    transition: .25s ease;
}

nav a:hover {
    color: white;
}

nav a:first-child {
    margin-left: 0;
}

nav .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -1px;
    color: white;
}

/* ================= HERO ================= */

.hero {
    min-height: 88vh;
    max-width: 1100px;
    margin: auto;
    padding: 120px 24px 80px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
}

.hero::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    background: rgba(139,92,246,.2);
    filter: blur(100px);
    z-index: -1;
}

.hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(55px, 9vw, 105px);
    line-height: .95;
    letter-spacing: -5px;
    max-width: 900px;
}

.hero h1 span {
    background: linear-gradient(
        90deg,
        #ffffff,
        #a78bfa,
        #60a5fa
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero p {
    max-width: 650px;
    margin-top: 30px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.8;
}

/* ================= BADGE ================= */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 8px 13px;
    margin-bottom: 25px;

    background: rgba(139,92,246,.08);
    border: 1px solid rgba(139,92,246,.25);
    border-radius: 999px;

    color: #c4b5fd;
    font-size: 13px;
}

.badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
}

/* ================= BUTTONS ================= */

.project-links {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

.project-links a,
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 12px 18px;

    border-radius: 12px;
    border: 1px solid var(--border);

    text-decoration: none;
    color: white;

    font-size: 13px;
    font-weight: 600;

    background: rgba(255,255,255,.045);

    transition:
        transform .25s ease,
        background .25s ease,
        border .25s ease,
        box-shadow .25s ease;
}

.project-links a:hover,
.btn:hover {
    transform: translateY(-3px);
    background: rgba(139,92,246,.15);
    border-color: rgba(139,92,246,.45);
    box-shadow: 0 10px 30px rgba(139,92,246,.15);
}

/* ================= SECTIONS ================= */

section {
    width: min(1100px, calc(100% - 48px));
    margin: 0 auto;
    padding: 100px 0;
}

section h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    letter-spacing: -2px;
    margin-bottom: 15px;
}

.section-label {
    color: #8b5cf6;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

/* ================= SKILLS ================= */

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 30px;
}

.skills span,
.skill {
    padding: 10px 15px;

    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);

    border-radius: 10px;

    color: #c7c7d0;
    font-size: 13px;

    transition: .25s ease;
}

.skills span:hover,
.skill:hover {
    color: white;
    border-color: rgba(139,92,246,.45);
    background: rgba(139,92,246,.09);
    transform: translateY(-2px);
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-top: 40px;
}

.stat {
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(15px);
}

.stat h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
}

.stat p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

/* ================= PROJECT GRID ================= */

.projects {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 18px;
    margin-top: 40px;
}

.project-card {
    position: relative;
    overflow: hidden;

    padding: 30px;

    min-height: 280px;

    border: 1px solid var(--border);
    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    backdrop-filter: blur(20px);

    transition:
        transform .35s ease,
        border .35s ease,
        box-shadow .35s ease;
}

.project-card::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: rgba(139,92,246,.12);
    filter: blur(70px);
    top: -80px;
    right: -80px;
    opacity: 0;
    transition: .4s ease;
}

.project-card:hover {
    transform: translateY(-8px);
    border-color: rgba(139,92,246,.35);
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
}

.project-card:hover::before {
    opacity: 1;
}

.project-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 23px;
    margin-bottom: 12px;
}

.project-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

/* project technology tags */

.project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 20px;
}

.project-tags span {
    padding: 6px 9px;
    border-radius: 7px;
    background: rgba(139,92,246,.08);
    color: #b9a7ff;
    font-size: 11px;
}

/* ================= CONTACT ================= */

.contact {
    text-align: center;
    padding: 130px 20px;
}

.contact h2 {
    font-size: clamp(40px, 7vw, 75px);
}

.contact p {
    max-width: 550px;
    margin: 20px auto 30px;
    color: var(--muted);
    line-height: 1.7;
}

/* ================= FOOTER ================= */

footer {
    border-top: 1px solid var(--border);
    padding: 30px 20px;
    text-align: center;
    color: #666673;
    font-size: 12px;
}

/* ================= MOBILE ================= */

@media (max-width: 750px) {

    nav {
        padding: 13px 16px;
    }

    nav .links {
        display: none;
    }

    .hero {
        min-height: 80vh;
        padding-top: 90px;
    }

    .hero h1 {
        font-size: 58px;
        letter-spacing: -3px;
    }

    .hero p {
        font-size: 16px;
    }

    section {
        width: min(100% - 30px, 1100px);
        padding: 70px 0;
    }

    section h2 {
        font-size: 34px;
    }

    .projects {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
